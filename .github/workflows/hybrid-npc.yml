name: Hybrid NPC checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run test:editors
      - run: npm run build
      - run: npm run lint
      - run: npm run evaluate:npcs -- --out evaluation-output
      - uses: actions/upload-artifact@v4
        with:
          name: reproducible-npc-evaluation
          path: evaluation-output/
